{% extends "portal/base.html" %}
{% block nav %}
<header class="topbar">
  <div class="container topbar-inner">
    <div class="brand-row">
      <a class="brand" href="{% url 'manage_dashboard' %}">Open Shift Portal</a>
      <form method="post" action="{% url 'manage_logout' %}" class="inline-form signout-form">
        {% csrf_token %}
        <button type="submit" class="linklike">Sign out</button>
      </form>
    </div>
    <nav class="nav">
      {% with path=request.path %}
      <a href="{% url 'manage_dashboard' %}" {% if path == '/manage/' or '/manage/shifts/' in path %}class="active"{% endif %}>Open Shifts</a>
      <a href="{% url 'staff_list' %}" {% if '/manage/staff/' in path %}class="active"{% endif %}>Staff</a>
      <a href="{% url 'group_list' %}" {% if '/manage/groups/' in path %}class="active"{% endif %}>Groups</a>
      <a href="{% url 'sms_log' %}" {% if '/manage/sms-log/' in path %}class="active"{% endif %}>SMS Log</a>
      <a href="{% url 'manage_history' %}" {% if '/manage/history/' in path %}class="active"{% endif %}>History</a>
      <a href="{% url 'manage_account' %}" {% if '/manage/account/' in path %}class="active"{% endif %}>Account</a>
      {% endwith %}
    </nav>
  </div>
</header>
{% endblock %}
